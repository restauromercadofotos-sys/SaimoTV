name: LumeFlix

on:
  workflow_dispatch:
    inputs:
      comparar_com:
        description: Execução anterior para conferir a assinatura de atualização
        required: false
        type: string
  pull_request:
    paths:
      - 'lumeflix/**'
      - '.github/workflows/apks.yml'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configurar assinatura estável dos APKs de teste
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          test -n "$CI_KEYSTORE_BASE64"
          printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > ci-debug.jks
          printf 'storeFile=../ci-debug.jks\nstoreType=PKCS12\nstorePassword=android\nkeyAlias=apps\nkeyPassword=android\n' > keystore.properties
      - name: Testar e compilar LumeFlix
        run: ./gradlew --no-daemon :lumeflix:testDebugUnitTest :lumeflix:assembleDebug
      - name: Obter APK anterior para comparação
        if: inputs.comparar_com != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.comparar_com }}
          name: lumeflix-debug
          path: ${{ runner.temp }}/lumeflix-anterior
      - name: Conferir pacote, recursos de marca e certificado
        shell: bash
        run: |
          set -euo pipefail
          apk=lumeflix/build/outputs/apk/debug/lumeflix-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/lumeflix-manifesto"
          grep -F "package: name='br.com.lumeflix.app'" "$RUNNER_TEMP/lumeflix-manifesto"
          grep -E "^application: .*lumeflix_app_icon.*lumeflix_tv_banner" "$RUNNER_TEMP/lumeflix-manifesto"
          grep '^leanback-launchable-activity:' "$RUNNER_TEMP/lumeflix-manifesto"
          certificado() {
            "$tools/apksigner" verify --print-certs "$1" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | sort -u
          }
          atual=$(certificado "$apk")
          esperado=$(keytool -exportcert -keystore ci-debug.jks -storepass android -alias apps | sha256sum | cut -d' ' -f1)
          test "$atual" = "$esperado"
          if [[ -d "$RUNNER_TEMP/lumeflix-anterior" ]]; then
            anterior=$(certificado "$RUNNER_TEMP"/lumeflix-anterior/*.apk)
            test "$atual" = "$anterior"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumeflix-debug
          path: lumeflix/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
