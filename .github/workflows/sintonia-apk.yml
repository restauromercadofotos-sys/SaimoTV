name: APK de teste da Sintonia TV
on:
  push:
    branches: [entrega/sintonia-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;36.0.0
      - name: Compilar APK
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Conferir pacote e preparar download
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/sintonia-manifesto"
          grep -F "package: name='br.com.sintonia.tv'" "$RUNNER_TEMP/sintonia-manifesto"
          cp "$apk" Sintonia-TV-1.0.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sintonia-TV-1.0.4-debug
          path: Sintonia-TV-1.0.4-debug.apk
          if-no-files-found: error
          retention-days: 30
